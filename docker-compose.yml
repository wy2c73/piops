services:
  pi-fleet-dashboard:
    build: .
    image: pi-fleet-dashboard:local
    container_name: pi-fleet-dashboard
    restart: unless-stopped
    ports:
      # Host port : container port. Change the first number if 3000 is
      # already in use on your NAS/host (e.g. "8088:3000").
      - "3000:3000"
    volumes:
      # Persists the device registry, encryption key, groups, alert
      # config, and custom commands across container restarts/rebuilds.
      # On Synology this typically lands under
      # /volume1/docker/pi-fleet-dashboard/data once you place this
      # project folder there -- see DOCKER.md.
      - ./data:/app/backend/data
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      # - POLL_INTERVAL_MS=15000
      # - POLL_CONCURRENCY=5
