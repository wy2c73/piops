<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PiOps &mdash; Sign in</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
<script>
(function () {
  try {
    var raw = localStorage.getItem('piOpsSettings') || localStorage.getItem('piFleetDashboardSettings');
    var theme = raw ? (JSON.parse(raw).theme || 'dark') : 'dark';
    document.documentElement.dataset.theme = theme;
  } catch (e) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <span class="brand-led led-online"></span>
      <span class="brand-name">PI OPS</span>
    </div>
    <form id="loginForm">
      <div class="form-row">
        <label for="loginPassword">Password</label>
        <div class="password-field">
          <input id="loginPassword" type="password" autofocus required />
          <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password" tabindex="-1"></button>
        </div>
      </div>
      <p class="test-result fail" id="loginError" hidden></p>
      <button type="submit" class="btn btn-primary login-submit">Sign in</button>
    </form>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.hidden = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Sign in failed');
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.hidden = false;
  }
});
</script>
<script src="password-toggle.js"></script>
</body>
</html>
