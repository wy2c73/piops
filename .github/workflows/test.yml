name: Tests

# Runs the backend test suite (backend/test/*.test.js, via `npm test`)
# on every push and pull request against main -- catches a regression
# the moment it lands, including from an edit made directly on GitHub's
# web UI rather than through the usual local-clone workflow.
#
# This only runs if you've pushed this repo to your own GitHub and have
# Actions enabled (Settings -> Actions -> General). Nothing here
# requires any secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom (a dev-only test dependency, see backend/package.json)
          # requires Node ^22.22.2 || ^24.15.0 || >=26.0.0 -- Node 20
          # fails hard here with a real crash inside jsdom's undici
          # dependency, not just an engine warning. This doesn't affect
          # what Node version PiOps itself runs on in production (see
          # the Dockerfile) -- only what's needed to run the test suite.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test
