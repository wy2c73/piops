name: Build and publish Docker image

# Builds the image defined by ./Dockerfile and pushes it to GitHub
# Container Registry (ghcr.io) whenever main changes, tagged both
# :latest and with the short commit SHA. This is what makes
# Watchtower-based auto-update possible (see DOCKER.md) -- without this
# workflow there's no published image for Watchtower to watch for.
#
# This only runs if you've pushed this repo to your own GitHub and have
# Actions enabled (Settings -> Actions -> General). Nothing here requires
# any secrets beyond the automatically-provided GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a rebuild manually from the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds, e.g. some Synology/NAS models)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (handles lowercasing GHCR requires)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
